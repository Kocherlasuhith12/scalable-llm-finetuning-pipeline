version: '3.8'

services:
  llm-api-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.serve
    container_name: scalable-llm-api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./outputs:/app/outputs
      - ./configs:/app/configs
      - ./data:/app/data
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
